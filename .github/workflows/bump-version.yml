name: Bump version and release

on:
  push:
    branches: [master]
    paths-ignore:
      # Prevent loop: don't re-trigger when only manifest.json changed
      - "custom_components/roowifi/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Bump patch version and create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version in manifest.json
        id: ver
        run: |
          OLD=$(jq -r '.version' custom_components/roowifi/manifest.json)
          NEW=$(echo "$OLD" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
          jq --arg v "$NEW" '.version = $v' custom_components/roowifi/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/roowifi/manifest.json
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped $OLD → $NEW"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/roowifi/manifest.json
          git commit -m "chore: bump version to ${{ steps.ver.outputs.version }} [skip ci]"
          git push

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          name: "v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
